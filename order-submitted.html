<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Submitted - MCF Restaurant</title>
  <style>
    :root {
      --primary: #ff9f1c;
      --bg: #1a202c;
      --card-bg: #232d3f;
      --text: #ffffff;
      --subtext: #a0aec0;
      --accent: #2ec4b6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 20px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
    }

    .card { 
      background: var(--card-bg); 
      max-width: 500px; 
      width: 100%; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
      text-align: center; 
    }

    .icon { font-size: 50px; color: var(--accent); margin-bottom: 15px; }
    h1 { color: var(--primary); margin-bottom: 10px; font-size: 24px; }

    p.notice { 
      font-size: 15px; 
      color: #e2e8f0; 
      margin-bottom: 20px; 
      background: rgba(46, 196, 182, 0.1); 
      padding: 12px; 
      border-radius: 8px; 
      border-left: 4px solid var(--accent); 
    }

    /* Progress Bar Container */
    .progress-container {
      width: 100%;
      background-color: #111827;
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
      height: 10px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: var(--primary);
      transition: width 0.1s linear;
    }

    .order-details { 
      text-align: left; 
      background: #111827; 
      padding: 18px; 
      border-radius: 8px; 
      margin-bottom: 20px; 
      font-size: 14px; 
      color: var(--subtext);
      display: none; 
    }

    .order-details strong { color: var(--text); }
    .order-details h3 { margin-bottom: 10px; color: var(--primary); }

    .item-row { 
      display: flex; 
      justify-content: space-between; 
      margin-bottom: 8px; 
      color: var(--text);
    }

    .total-row { 
      display: flex; 
      justify-content: space-between; 
      font-weight: bold; 
      font-size: 16px; 
      color: var(--primary);
      border-top: 1px solid #374151; 
      padding-top: 10px; 
      margin-top: 10px; 
    }

    .btn-return { 
      background: var(--primary); 
      color: #ffffff; 
      padding: 12px 24px; 
      border: none; 
      border-radius: 8px; 
      font-weight: 600; 
      cursor: pointer; 
      text-decoration: none; 
      display: inline-block; 
      width: 100%; 
      transition: background 0.2s ease;
    }

    .btn-return:hover { background: #e68a17; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">✓</div>
    <h1>Order Submitted!</h1>
    <p class="notice">Your order is submitted, our staff will connect with you shortly.</p>

    <!-- Progress Bar -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="order-details" id="orderDetails">
      <h3>Order Summary</h3>
      <div id="custInfo">Loading order summary...</div>
      <hr style="margin: 12px 0; border: none; border-top: 1px solid #374151;" />
      <div id="itemList"></div>
      <div class="total-row" id="totalRow"></div>
    </div>

    <a href="order-items.html" class="btn-return">Return to Order Menu</a>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLNIvkDOxyrdAL1mmALeoIVIa8ZB_TkhTXEyQUvrsUW3HaDrtrK7IOU7oxlz47vN4ROQ/exec";

    window.onload = function() {
      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.getElementById('progressContainer');
      const orderDetails = document.getElementById('orderDetails');
      
      const duration = 5000; // 12 seconds
      const intervalTime = 100;
      let elapsedTime = 0;

      // Progress bar animation
      const timer = setInterval(() => {
        elapsedTime += intervalTime;
        const progressPercent = Math.min((elapsedTime / duration) * 100, 100);
        progressBar.style.width = progressPercent + '%';

        if (elapsedTime >= duration) {
          clearInterval(timer);
          progressContainer.style.display = 'none';
          orderDetails.style.display = 'block';
          
          fetchOrderDetailsFromSheet();
        }
      }, intervalTime);

      async function fetchOrderDetailsFromSheet() {
        const params = new URLSearchParams(window.location.search);
        const mobile = params.get('mobile');

        if (!mobile) {
          document.getElementById('custInfo').innerText = "No order details found.";
          return;
        }

        try {
          const res = await fetch(`${GOOGLE_SCRIPT_URL}?mobile=${encodeURIComponent(mobile)}`);
          const data = await res.json();

          if (data.status === "success" && data.items && data.items.length > 0) {
            document.getElementById('custInfo').innerHTML = `
              <p><strong>Name:</strong> ${data.customerName}</p>
              <p><strong>Mobile:</strong> +91 ${data.mobile}</p>
              <p><strong>Address:</strong> ${data.address}</p>
            `;

            let itemsHtml = '';
            let grandTotal = 0;

            data.items.forEach(item => {
              grandTotal += Number(item.price);
              itemsHtml += `
                <div class="item-row">
                  <span>${item.name} (${item.size}) x ${item.quantity}</span>
                  <span>₹${item.price}</span>
                </div>
              `;
            });

            document.getElementById('itemList').innerHTML = itemsHtml;
            document.getElementById('totalRow').innerHTML = `
              <span>Total Amount:</span>
              <span>₹${grandTotal}</span>
            `;
          } else {
            document.getElementById('custInfo').innerText = "Order records could not be retrieved from spreadsheet.";
          }
        } catch (e) {
          console.error("Error fetching order details:", e);
          document.getElementById('custInfo').innerText = "Failed to load order summary.";
        }
      }
    };
  </script>
</body>
</html>
