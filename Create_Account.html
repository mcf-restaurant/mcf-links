<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - MCF Restaurant</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 420px;
      padding: 32px;
      text-align: center;
    }

    .restaurant-title {
      color: #f59e0b;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .google-btn {
      width: 100%;
      background-color: #ffffff;
      color: #1e293b;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .google-btn:hover {
      background-color: #f1f5f9;
      transform: translateY(-1px);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #64748b;
      margin: 16px 0;
      font-size: 0.85rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #334155;
    }

    .divider span {
      padding: 0 10px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #f59e0b;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    #statusMessage {
      margin-top: 16px;
      font-size: 0.85rem;
      min-height: 20px;
    }

    .status-success { color: #10b981; }
    .status-error { color: #ef4444; }
    .status-info { color: #f59e0b; }
  </style>
</head>
<body>

  <div class="login-card">
    <h1 class="restaurant-title">MCF RESTAURANT</h1>
    <p class="subtitle">Sign in to your account</p>

    <!-- Google One-Click Sign In -->
    <button type="button" class="google-btn" onclick="handleGoogleSignIn()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Sign in with Google Account
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <!-- Username / Email Form -->
    <form id="loginForm" onsubmit="handleStandardSignIn(event)">
      <div class="input-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" placeholder="Enter username or email" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    // Replace with your Google Apps Script Exec Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyewXaLQBPbR19eQap85eB0mLjBiWGbKaUO6UrLPnu-5ZWHiHAtvGXagcvEwmD64NXs/exec";

    // Hash password locally with SHA-256 before sending
    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function setStatus(msg, type = "info") {
      const elem = document.getElementById("statusMessage");
      elem.innerText = msg;
      elem.className = "status-" + type;
    }

    async function handleStandardSignIn(e) {
      e.preventDefault();
      const identifier = document.getElementById("identifier").value.trim();
      const plainPassword = document.getElementById("password").value;

      setStatus("Signing in...", "info");
      const passwordHash = await hashPassword(plainPassword);

      sendRequest({
        action: "standardLogin",
        identifier: identifier,
        passwordHash: passwordHash
      });
    }

    function handleGoogleSignIn() {
      setStatus("Authenticating Google session...", "info");
      sendRequest({
        action: "googleLogin"
      });
    }

    function sendRequest(payload) {
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          setStatus("Welcome back, " + data.user.fullName + "!", "success");
          // Save user object locally
          localStorage.setItem("mcf_user", JSON.stringify(data.user));
          // Redirect to home page after 1.5 seconds
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1500);
        } else {
          setStatus(data.message || "Sign in failed.", "error");
        }
      })
      .catch(err => {
        setStatus("Network or server error.", "error");
        console.error(err);
      });
    }
  </script>
</body>
</html>
