<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCF Restaurant - Order Menu</title>
  <style>
    :root {
      --bg: #151c28;
      --card-bg: #1c2638;
      --input-bg: #101724;
      --primary: #f28014;
      --primary-hover: #d96f0b;
      --text: #e6edf7;
      --text-muted: #94a3b8;
      --border: #2a374e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 110px; }

    header {
      background: var(--card-bg);
      padding: 18px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    header h1 {
      color: var(--primary);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .categories-nav {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 14px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 65px;
      z-index: 90;
      scrollbar-width: none;
    }
    .categories-nav::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--input-bg);
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .cat-btn:hover { color: var(--text); border-color: var(--primary); }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 10px rgba(242, 128, 20, 0.3); }

    .menu-container { max-width: 1000px; margin: 25px auto; padding: 0 20px; }
    .category-section { margin-bottom: 35px; }
    .category-title {
      font-size: 20px;
      font-weight: 700;
      margin-left: 4px;
      margin-bottom: 18px;
      color: var(--primary);
      display: inline-block;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    .item-card {
      background: var(--card-bg);
      border-radius: 12px;
      display: flex;
      padding: 14px;
      gap: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      align-items: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .item-card:hover { transform: translateY(-2px); border-color: #3b4d6b; }
    
    .item-img {
      width: 85px;
      height: 85px;
      border-radius: 10px;
      object-fit: cover;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
    }
    
    .item-details { flex: 1; }
    .item-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; color: var(--text); }
    .item-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .item-price { font-weight: 700; color: var(--primary); font-size: 18px; }
    
    .qty-control {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--input-bg);
    }
    .qty-btn {
      background: transparent;
      color: var(--primary);
      border: none;
      width: 30px;
      height: 30px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s ease;
    }
    .qty-btn:hover { background: rgba(242, 128, 20, 0.15); }
    .qty-val { width: 28px; text-align: center; font-size: 14px; font-weight: 600; color: var(--text); }

    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1000px;
      margin: 0 auto;
    }
    .cart-info { font-size: 16px; font-weight: 600; color: var(--text); }
    .cart-info span { color: var(--primary); }
    
    .cart-btn {
      background: var(--primary);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .cart-btn:hover { background: var(--primary-hover); }
    
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 200;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 14px;
      width: 90%;
      max-width: 450px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .modal-content h2 { margin-bottom: 18px; color: var(--primary); font-size: 22px; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .modal-content input:focus, .modal-content textarea:focus { border-color: var(--primary); }
    
    .mobile-input-wrapper {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .mobile-input-wrapper:focus-within { border-color: var(--primary); }
    .country-code {
      padding: 12px 0 12px 14px;
      color: var(--primary);
      font-weight: 600;
      font-size: 14px;
      user-select: none;
    }
    .mobile-input-wrapper input {
      border: none !important;
      background: transparent !important;
      padding-left: 8px !important;
    }

    .address-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .location-btn {
      background: transparent;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s ease;
    }
    .location-btn:hover { background: rgba(242, 128, 20, 0.15); }

    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; }
    .modal-btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-cancel { background: var(--input-bg); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-cancel:hover { background: #1e2b40; color: var(--text); }
    .btn-submit { background: var(--primary); color: white; }
    .btn-submit:hover { background: var(--primary-hover); }

    #otpGroup {
      display: none;
      margin-top: 10px;
      border-top: 1px dashed var(--border);
      padding-top: 14px;
    }
    .otp-status {
      font-size: 12px;
      color: #34d399;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MCF Restaurant Items</h1>
  </header>

  <div class="categories-nav" id="catNav"></div>

  <div class="menu-container" id="menuGrid"></div>

  <!-- Cart Bottom Bar -->
  <div class="cart-bar">
    <div class="cart-info">
      <span id="totalItems">0 Items</span> | ₹<span id="totalPrice">0</span>
    </div>
    <button class="cart-btn" onclick="openCheckout()">Checkout / Add to Cart</button>
  </div>

  <!-- Customer Details Modal -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <h2>Customer Details</h2>
      <form id="checkoutForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <input type="text" id="custName" placeholder="Full Name" required />
        </div>

        <div class="form-group">
          <input type="email" id="custEmail" placeholder="Email Address" required />
        </div>
        
        <div class="form-group">
          <div class="mobile-input-wrapper">
            <span class="country-code">+91</span>
            <input type="tel" id="custMobile" placeholder="Mobile Number" required pattern="[0-9]{10}" maxlength="10" />
          </div>
        </div>

        <div class="form-group">
          <div class="address-header">
            <label style="font-size: 12px; color: var(--text-muted);">Delivery Address</label>
            <button type="button" class="location-btn" onclick="getCurrentLocation()">
              📍 Use Current Location
            </button>
          </div>
          <textarea id="custAddress" placeholder="Enter your full address" rows="3" required></textarea>
        </div>

        <!-- Hidden OTP Field Section -->
        <div class="form-group" id="otpGroup">
          <div class="otp-status">An OTP has been sent to your email address.</div>
          <input type="text" id="custOtp" placeholder="Enter 6-digit OTP" pattern="[0-9]{6}" maxlength="6" />
        </div>

        <div class="modal-actions">
          <button type="button" class="modal-btn btn-cancel" onclick="closeCheckout()">Cancel</button>
          <button type="submit" class="modal-btn btn-submit" id="submitBtn">Send OTP</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7bZ9TWTnVR5b0oFBOPZX6P8zt3Bn-1hR6aYMJQYeA2qpsSXIICOtTktv6mU63X2UZDg/exec";

    let generatedOTP = null;
    let isOtpSent = false;

    const itemsData = [
      { id: 1, category: "Soup", name: "Hot & Sour Soup", size: "Full", price: 70 },
      { id: 2, category: "Soup", name: "Manchow Soup", size: "Full", price: 80 },
      { id: 93, category: "Combo", name: "Chilly Paneer with Rice", size: "Full", price: 130 },
      { id: 94, category: "Combo", name: "Pizza with Cold Drinks", size: "Full", price: 120 }
    ];

    let cart = {};

    function renderMenu() {
      const categories = [...new Set(itemsData.map(i => i.category))];
      const nav = document.getElementById("catNav");
      const grid = document.getElementById("menuGrid");

      nav.innerHTML = categories.map((cat, idx) => 
        `<button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="filterCat('${cat}', this)">${cat}</button>`
      ).join('');

      grid.innerHTML = categories.map(cat => {
        const catItems = itemsData.filter(i => i.category === cat);
        return `
          <div class="category-section" id="sec-${cat}">
            <div class="category-title">${cat}</div>
            <div class="grid">
              ${catItems.map(item => `
                <div class="item-card">
                  <img class="item-img" src="https://raw.githubusercontent.com/mcf-restaurant/images/main/${item.name}.png" alt="${item.name}"/>
                  <div class="item-details">
                    <div class="item-name">${item.name}</div>
                    <div class="item-meta">Size: ${item.size}</div>
                    <div class="item-price">₹${item.price}</div>
                  </div>
                  <div class="qty-control">
                    <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                    <span class="qty-val" id="qty-${item.id}">0</span>
                    <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`sec-${cat}`).scrollIntoView({ behavior: 'smooth' });
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      document.getElementById(`qty-${id}`).innerText = cart[id] || 0;
      updateCartSummary();
    }

    function updateCartSummary() {
      let count = 0;
      let total = 0;
      for (const id in cart) {
        const item = itemsData.find(i => i.id == id);
        count += cart[id];
        total += item.price * cart[id];
      }
      document.getElementById('totalItems').innerText = `${count} Items`;
      document.getElementById('totalPrice').innerText = total;
    }

    function openCheckout() {
      if (Object.keys(cart).length === 0) {
        alert("Please add at least one item to cart.");
        return;
      }
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').style.display = 'none';
      isOtpSent = false;
      document.getElementById('otpGroup').style.display = 'none';
      document.getElementById('submitBtn').innerText = "Send OTP";
      document.getElementById('custEmail').readOnly = false;
    }

    function getCurrentLocation() {
      const addressBox = document.getElementById('custAddress');
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }

      addressBox.value = "Fetching location...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          try {
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
            const data = await response.json();
            if (data && data.display_name) {
              addressBox.value = data.display_name;
            } else {
              addressBox.value = `Lat: ${latitude}, Lon: ${longitude}`;
            }
          } catch (err) {
            addressBox.value = `Lat: ${latitude}, Lon: ${longitude}`;
          }
        },
        (error) => {
          alert("Unable to retrieve location: " + error.message);
          addressBox.value = "";
        }
      );
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (!isOtpSent) {
        await sendOTP();
      } else {
        await verifyAndSubmitOrder();
      }
    }

    async function sendOTP() {
      const email = document.getElementById('custEmail').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerText = "Sending OTP...";

      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: "sendOtp",
            email: email,
            otp: generatedOTP
          })
        });

        isOtpSent = true;
        document.getElementById('otpGroup').style.display = 'block';
        document.getElementById('custOtp').required = true;
        document.getElementById('custEmail').readOnly = true;
        submitBtn.innerText = "Verify & Confirm Order";

      } catch (err) {
        alert("Error sending OTP: " + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    }

    async function verifyAndSubmitOrder() {
      const enteredOtp = document.getElementById('custOtp').value;
      const submitBtn = document.getElementById('submitBtn');

      if (enteredOtp !== generatedOTP) {
        alert("Invalid OTP! Please check your email and try again.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting Order...";

      const rawMobile = document.getElementById('custMobile').value;
      const fullMobile = rawMobile;

      const cartItems = Object.keys(cart).map(id => {
        const item = itemsData.find(i => i.id == id);
        return {
          id: item.id,
          name: item.name,
          size: item.size,
          price: item.price,
          quantity: cart[id]
        };
      });

      const payload = {
        customerName: document.getElementById('custName').value,
        customerEmail: document.getElementById('custEmail').value,
        mobile: fullMobile,
        address: document.getElementById('custAddress').value,
        items: cartItems
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        
        window.location.href = `order-submitted.html?mobile=${encodeURIComponent(fullMobile)}`;
      } catch (err) {
        alert("Error submitting order: " + err.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "Verify & Confirm Order";
      }
    }

    renderMenu();
  </script>
</body>
</html>
