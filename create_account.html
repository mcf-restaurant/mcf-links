<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - MCF Restaurant</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); width: 100%; max-width: 420px; padding: 32px; text-align: center; }
    .restaurant-title { color: #f59e0b; font-size: 1.8rem; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    .input-group input, .input-group select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #f8fafc; font-size: 0.95rem; outline: none; }
    .input-group input:focus, .input-group select:focus { border-color: #f59e0b; }
    .submit-btn { width: 100%; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff; font-weight: 600; border: none; border-radius: 8px; padding: 12px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .footer-text { margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
    .footer-text a { color: #f59e0b; text-decoration: none; font-weight: 600; }
    #statusMessage { margin-top: 16px; font-size: 0.85rem; min-height: 20px; }
    .status-success { color: #10b981; }
    .status-error { color: #ef4444; }
    .status-info { color: #f59e0b; }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="restaurant-title">MCF RESTAURANT</h1>
    <p class="subtitle">Create a New Account</p>

    <form id="createAccountForm" onsubmit="handleCreateAccount(event)">
      <div class="input-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
      </div>
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="input-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" maxlength="10" title="Please enter a valid 10-digit mobile number" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password (min. 6 characters)" required minlength="6">
      </div>
      <div class="input-group">
        <label for="mcfDiety">MCF Diety?</label>
        <select id="mcfDiety" required>
          <option value="" disabled selected>Select an option</option>
          <option value="YES">YES</option>
          <option value="NO">NO</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
    </form>

    <div id="statusMessage"></div>

    <div class="footer-text">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <script>
    const CREATE_ACCOUNT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOBKj4GuJDE138JiuW0W1opTpeTbApczM1o7_QFu3OWz-TYn9soayB4x4_LZsZTgw/exec";

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function setStatus(msg, type = "info") {
      const elem = document.getElementById("statusMessage");
      elem.innerText = msg;
      elem.className = "status-" + type;
    }

    async function handleCreateAccount(e) {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const mobile = document.getElementById("mobile").value.trim();
      const mcfDiety = document.getElementById("mcfDiety").value;
      const plainPassword = document.getElementById("password").value;
      const submitBtn = document.getElementById("submitBtn");

      if (!/^\d{10}$/.test(mobile)) {
        setStatus("Please enter a valid 10-digit mobile number.", "error");
        return;
      }

      setStatus("Creating account...", "info");
      submitBtn.disabled = true;

      try {
        const passwordHash = await hashPassword(plainPassword);

        const res = await fetch(CREATE_ACCOUNT_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "createAccount",
            fullName: fullName,
            email: email,
            mobile: mobile,
            mcfDiety: mcfDiety,
            passwordHash: passwordHash
          })
        });

        const data = await res.json();
        submitBtn.disabled = false;

        if (data.success) {
          localStorage.setItem("mcf_user", JSON.stringify(data.user));
          setStatus("Account created successfully! Redirecting...", "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } else {
          setStatus(data.message || "Failed to create account.", "error");
        }
      } catch (err) {
        submitBtn.disabled = false;
        setStatus("Network or server error.", "error");
      }
    }
  </script>
</body>
</html>
