<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diety Analysis - MCF Restaurant</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; padding: 30px 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .title { color: #f59e0b; font-size: 1.8rem; font-weight: 700; }
    .back-btn { background: #334155; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
    .back-btn:hover { background: #475569; }
    .table-card { background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; overflow-x: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 18px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(51, 65, 85, 0.4); }
    .status-loading { padding: 40px; text-align: center; color: #94a3b8; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; background: #1e293b; color: #f8fafc; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="title">Diety Analysis Data</h1>
      <a href="success.html" class="back-btn">← Back to Dashboard</a>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Cust ID</th>
            <th>Name</th>
            <th>Mobile Number</th>
            <th>Diet Type</th>
            <th>From Date</th>
            <th>Total Diets</th>
            <th>Pending Payment</th>
            <th>Remaining Diets</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="8" class="status-loading">Loading Diety Analysis data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwfQ0HxrF4NEIerHbv2x_x_lNFb_C_LS3Clt5qJLa3Oe8PUb60_0Xdh4DXAOGqwRUME/exec";

    document.addEventListener("DOMContentLoaded", () => {
      const userDataStr = localStorage.getItem("mcf_user");
      if (!userDataStr) {
        window.location.href = "login.html";
        return;
      }

      fetchData();
    });

    async function fetchData() {
      const tableBody = document.getElementById("tableBody");
      try {
        const res = await fetch(API_URL);
        const result = await res.json();

        if (result.success && result.data.length > 0) {
          tableBody.innerHTML = result.data.map(item => `
            <tr>
              <td><span class="badge">${item.custID}</span></td>
              <td><strong>${item.name}</strong></td>
              <td>${item.mobileNumber}</td>
              <td>${item.dietType}</td>
              <td>${item.fromDate}</td>
              <td>${item.totalDiets}</td>
              <td style="color: ${item.pendingPayment > 0 ? '#ef4444' : '#10b981'}; font-weight: 600;">₹${item.pendingPayment}</td>
              <td style="font-weight: 600; color: #f59e0b;">${item.remainingDiets}</td>
            </tr>
          `).join('');
        } else {
          tableBody.innerHTML = `<tr><td colspan="8" class="status-loading">No record found.</td></tr>`;
        }
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="8" class="status-loading" style="color: #ef4444;">Error fetching data: ${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
