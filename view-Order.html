<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Today's Orders</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #ff9f1c;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --pending: #eab308;
      --delivered: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    
    header {
      max-width: 1200px;
      margin: 0 auto 25px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
    }

    header h1 { color: var(--accent); font-size: 24px; }
    .header-btns { display: flex; gap: 10px; }
    
    .refresh-btn, .audio-btn {
      background: #3b82f6; color: white; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .refresh-btn:hover { background: #2563eb; }
    .audio-btn.enabled { background: #22c55e; }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .order-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 10px;
    }

    .cust-name { font-weight: 700; font-size: 18px; color: #ffffff; }
    .order-time { font-size: 12px; color: var(--subtext); }

    .cust-info { font-size: 14px; color: var(--subtext); margin-bottom: 15px; }
    .cust-info p { margin-bottom: 4px; }
    .cust-info strong { color: var(--text); }

    .items-list {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 16px;
      color: var(--accent);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 8px;
    }

    .status-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-pending {
      background: rgba(234, 179, 8, 0.15);
      color: var(--pending);
      border: 1px solid var(--pending);
    }
    .btn-pending:hover { background: var(--pending); color: #000; }

    .btn-delivered {
      background: rgba(34, 197, 94, 0.15);
      color: var(--delivered);
      border: 1px solid var(--delivered);
    }
    .btn-delivered:hover { background: var(--delivered); color: #000; }

    .no-orders { text-align: center; color: var(--subtext); grid-column: 1 / -1; padding: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>📋 Today's Orders Dashboard</h1>
    <div class="header-btns">
      <button id="audioToggleBtn" class="audio-btn" onclick="enableAudio()">🔔 Enable Sound</button>
      <button class="refresh-btn" onclick="loadTodaysOrders()">🔄 Refresh</button>
    </div>
  </header>

  <div class="orders-grid" id="ordersGrid">
    <div class="no-orders">Loading today's orders...</div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1SVXMyA_7nuMV4oHaymZajyRkRl4oRoBLJxntH0LlxvyYr1ynPnE_bBsySrrPsZHrUA/exec";

    // --- SERVICE WORKER REGISTRATION (FOR MOBILE CHROME NOTIFICATIONS) ---
    let swRegistration = null;

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(swUrl).then(reg => {
        swRegistration = reg;
      }).catch(err => console.log('SW registration error:', err));
    }
    // ---------------------------------------------------------------------

    // --- AUDIO & ALERTS SETUP ---
    let audioEnabled = false;
    let isBuzzerPlaying = false;
    let previousPendingCount = 0;

    const buzzerAudio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
    buzzerAudio.loop = true;

    function enableAudio() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }

      audioEnabled = true;
      buzzerAudio.play().then(() => {
        buzzerAudio.pause();
        buzzerAudio.currentTime = 0;
      }).catch(err => console.log("Audio unlock failed:", err));

      const btn = document.getElementById('audioToggleBtn');
      btn.innerText = "🔔 Sound Active";
      btn.classList.add('enabled');
    }

    function startBuzzer() {
      if (!audioEnabled || isBuzzerPlaying) return;
      
      buzzerAudio.play().then(() => {
        isBuzzerPlaying = true;
      }).catch(err => console.log("Buzzer playback error:", err));
    }

    function stopBuzzer() {
      if (isBuzzerPlaying) {
        buzzerAudio.pause();
        buzzerAudio.currentTime = 0;
        isBuzzerPlaying = false;
      }
    }

    function sendSystemNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        // Mobile Chrome requires serviceWorker registration to show notifications
        if (swRegistration && swRegistration.showNotification) {
          swRegistration.showNotification(title, {
            body: body,
            icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png',
            vibrate: [200, 100, 200]
          });
        } else {
          try {
            new Notification(title, { body: body });
          } catch (e) {
            console.log("Desktop notification fallback error:", e);
          }
        }
      }
    }
    // ----------------------------

    async function loadTodaysOrders() {
      const grid = document.getElementById('ordersGrid');

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();

        if (data.status === "success" && data.orders.length > 0) {
          const pendingOrders = data.orders.filter(order => order.status !== "Delivered");
          const hasPendingOrders = pendingOrders.length > 0;

          if (hasPendingOrders) {
            startBuzzer();

            if (pendingOrders.length > previousPendingCount) {
              sendSystemNotification("🔔 New Order Received!", `You have ${pendingOrders.length} pending order(s).`);
            }
          } else {
            stopBuzzer();
          }

          previousPendingCount = pendingOrders.length;

          grid.innerHTML = data.orders.map(order => {
            const isDelivered = order.status === "Delivered";
            return `
              <div class="order-card">
                <div>
                  <div class="card-header">
                    <span class="cust-name">${order.customerName}</span>
                    <span class="order-time">🕒 ${order.formattedTime}</span>
                  </div>

                  <div class="cust-info">
                    <p><strong>Mobile:</strong> ${order.mobile}</p>
                    <p><strong>Address:</strong> ${order.address}</p>
                  </div>

                  <div class="items-list">
                    ${order.items.map(item => `
                      <div class="item-row">
                        <span>${item.name} (${item.size}) x${item.quantity}</span>
                        <span>₹${item.price}</span>
                      </div>
                    `).join('')}
                    <div class="total-row">
                      <span>Total:</span>
                      <span>₹${order.totalAmount}</span>
                    </div>
                  </div>
                </div>

                <button 
                  class="status-btn ${isDelivered ? 'btn-delivered' : 'btn-pending'}" 
                  onclick="toggleStatus('${order.timestamp}', '${order.mobile}', '${order.status}', this)">
                  ${isDelivered ? '✓ Status: Delivered' : '⏳ Status: Pending (Click to Mark Delivered)'}
                </button>
              </div>
            `;
          }).join('');
        } else {
          stopBuzzer();
          previousPendingCount = 0;
          grid.innerHTML = '<div class="no-orders">No orders received today yet!</div>';
        }
      } catch (err) {
        grid.innerHTML = `<div class="no-orders">Error loading orders: ${err.message}</div>`;
      }
    }

    async function toggleStatus(timestamp, mobile, currentStatus, btn) {
      const newStatus = currentStatus === "Delivered" ? "Pending" : "Delivered";
      btn.disabled = true;
      btn.innerText = "Updating...";

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?action=updateStatus&timestamp=${encodeURIComponent(timestamp)}&mobile=${encodeURIComponent(mobile)}&status=${encodeURIComponent(newStatus)}`);
        const data = await res.json();

        if (data.status === "success") {
          loadTodaysOrders();
        } else {
          alert("Failed to update status: " + data.message);
          btn.disabled = false;
        }
      } catch (err) {
        alert("Error updating status: " + err.message);
        btn.disabled = false;
      }
    }

    // --- BACKGROUND TIMER (WEB WORKER) ---
    const workerBlob = new Blob([`
      setInterval(() => {
        postMessage('fetch');
      }, 5000);
    `], { type: 'application/javascript' });

    const worker = new Worker(URL.createObjectURL(workerBlob));
    worker.onmessage = () => {
      loadTodaysOrders();
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && audioEnabled) {
        loadTodaysOrders();
      }
    });

    // Initial load
    loadTodaysOrders();
  </script>
</body>
</html>
